<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="static/style.css">
    <!-- Puter.js for Free Google AI Access -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>🧠 Gemini Chatbot</h1>
                <p class="subtitle">Powered by Google Gemini AI</p>
            </div>
            <div class="header-right">
                <button class="btn-icon" id="statusBtn" title="API Status">
                    <span class="status-indicator disconnected"></span>
                    <span class="status-text">Checking...</span>
                </button>
                <button class="btn-icon" id="changeRoleBtn" title="Change Role">↩️</button>
                <button class="btn-icon" id="settingsBtn" title="Settings">⚙️</button>
                <button class="btn-icon" id="historyBtn" title="History">📜</button>
            </div>
        </div>

        <!-- Welcome Message -->
        <div class="welcome-message" id="welcomeMessage">
            <div class="welcome-content">
                <div class="welcome-icon">🧠</div>
                <h2>Welcome to Gemini Chatbot</h2>
                <p>Chat with Google's powerful Gemini AI model. Choose a role below to customize the conversation!</p>
                <div class="role-selector-welcome">
                    <label for="roleSelectWelcome">Select a Role:</label>
                    <select id="roleSelectWelcome">
                        <option value="assistant">Assistant</option>
                        <option value="python_expert">Python Expert</option>
                        <option value="customer_support">Customer Support</option>
                        <option value="teacher">Teacher</option>
                        <option value="tech_writer">Tech Writer</option>
                        <option value="code_reviewer">Code Reviewer</option>
                        <option value="business_advisor">Business Advisor</option>
                        <option value="creative_writer">Creative Writer</option>
                        <option value="data_analyst">Data Analyst</option>
                    </select>
                    <button class="btn-continue" id="continueBtn">Continue →</button>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <!-- Messages will be dynamically added here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <form id="chatForm" onsubmit="chatbot.sendMessage(event)">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                    disabled
                >
                <button type="submit" id="sendBtn" disabled>Send</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="document.getElementById('settingsModal').style.display='none'">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="roleSelect">Role:</label>
                    <select id="roleSelect">
                        <option value="assistant">Assistant</option>
                        <option value="python_expert">Python Expert</option>
                        <option value="customer_support">Customer Support</option>
                        <option value="teacher">Teacher</option>
                        <option value="tech_writer">Tech Writer</option>
                        <option value="code_reviewer">Code Reviewer</option>
                        <option value="business_advisor">Business Advisor</option>
                        <option value="creative_writer">Creative Writer</option>
                        <option value="data_analyst">Data Analyst</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="locationInput">Location:</label>
                    <input type="text" id="locationInput" placeholder="e.g., San Francisco, CA">
                </div>

                <div class="setting-group">
                    <label for="timezoneInput">Timezone:</label>
                    <input type="text" id="timezoneInput" placeholder="e.g., PST, UTC">
                </div>

                <div class="setting-group">
                    <label for="expertiseLevel">Expertise Level:</label>
                    <select id="expertiseLevel">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>

                <button class="btn-primary" onclick="chatbot.saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Chat History</h2>
                <button class="close-btn" onclick="document.getElementById('historyModal').style.display='none'">&times;</button>
            </div>
            <div class="modal-body">
                <div id="historyList" class="history-list"></div>
                <button class="btn-danger" onclick="chatbot.showClearConfirmation()">Clear History</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirm Action</h2>
            </div>
            <div class="modal-body">
                <p id="confirmationMessage"></p>
                <div class="button-group">
                    <button class="btn-primary" onclick="chatbot.confirmClear()">Yes, Clear</button>
                    <button class="btn-secondary" onclick="document.getElementById('confirmationModal').style.display='none'">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
